<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pocket Deck</title>
<style>
:root{--bg:#0b0b12;--card:#15151f;--line:#262636;--tx:#f2f2f7;--mu:#8a8aa3;--a:#18e0ff;--b:#ff3d9a;--ok:#1ed760}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 16px);user-select:none}
h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
button{font:inherit;color:var(--tx);background:#20202e;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
button:active{filter:brightness(1.4)}
input[type=text],input[type=number]{font:inherit;color:var(--tx);background:#0f0f18;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.hide{display:none!important}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:430px){.decks{grid-template-columns:1fr}}
.deck{--c:var(--a);margin:0;position:relative}
.deck.B{--c:var(--b)}
.deck.live{border-color:var(--c);box-shadow:0 0 18px -4px var(--c)}
.tag{font-weight:800;color:var(--c);letter-spacing:.1em;display:flex;justify-content:space-between}
.live .tag::after{content:"● LIVE";font-size:11px}
.tag::after{content:"";}
.trk{display:flex;gap:10px;align-items:center;margin:8px 0}
.trk img{width:56px;height:56px;border-radius:8px;background:#222;object-fit:cover}
.trk b,.trk span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk span{color:var(--mu);font-size:13px}
.trk div{min-width:0}
input[type=range]{width:100%;accent-color:var(--c,var(--a));height:32px}
.time{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.row{display:grid;gap:6px;margin-top:8px}
.r4{grid-template-columns:repeat(4,1fr)}.r5{grid-template-columns:repeat(5,1fr)}.r2{grid-template-columns:1fr 1fr}
.pad{min-height:52px;font-weight:700}
.pad.set{background:var(--c);color:#000;border-color:var(--c)}
.loop.on{background:var(--c);color:#000;border-color:var(--c)}
.lbl{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
.play{background:var(--c);color:#000;font-weight:800;border-color:var(--c)}
.mix{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mix .big{min-height:60px;font-weight:800;font-size:16px}
.res{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.res img{width:40px;height:40px;border-radius:6px}
.res .m{flex:1;min-width:0}.res .m b,.res .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .m span{color:var(--mu);font-size:12px}
.res button{min-width:44px;font-weight:800}
.res .ba{color:var(--a)}.res .bb{color:var(--b)}
small,.note{color:var(--mu);font-size:12px}
.err{color:#ff7a7a}
a{color:var(--a)}
</style>
</head>
<body>
<header><h1>Pocket Deck</h1><button id="gear">Setup</button></header>

<section id="setup" class="card">
  <b>Connect Spotify</b>
  <p class="note">Needs Spotify <b>Premium</b> and your own Spotify developer app (free). In the
  <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">dashboard</a>, create an app, tick <i>Web Playback SDK</i>,
  and add this exact Redirect URI:</p>
  <input type="text" id="redir" readonly>
  <p class="note">Then paste the app's Client ID:</p>
  <input type="text" id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off">
  <div class="row r2"><button id="login" class="play" style="--c:var(--ok)">Log in with Spotify</button><button id="start" class="hide play" style="--c:var(--ok)">▶ Start set</button></div>
  <p id="status" class="note"></p>
</section>

<div id="app" class="hide">
  <section class="card">
    <input type="text" id="q" placeholder="Search Spotify tracks…" autocomplete="off">
    <div id="results"></div>
  </section>

  <div class="decks" id="decks"></div>

  <section class="card" style="margin-top:12px">
    <div class="mix">
      <button class="big" id="toA" style="color:var(--a)">◀ MIX TO A</button>
      <small id="liveLbl">—</small>
      <button class="big" id="toB" style="color:var(--b)">MIX TO B ▶</button>
    </div>
    <div class="row r2">
      <button id="cutA">Cut to A</button><button id="cutB">Cut to B</button>
    </div>
    <div class="lbl">Fade time: <span id="ftv">4</span>s</div>
    <input type="range" id="ft" min="1" max="12" step="1" value="4">
    <div class="lbl">Master volume</div>
    <input type="range" id="vol" min="0" max="100" value="80">
  </section>
  <p class="note" id="log"></p>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), LS=(()=>{try{return localStorage}catch(e){return {}}})();
const SCOPES='streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
const REDIR=location.origin+location.pathname;
const fmt=ms=>{ms=Math.max(0,ms|0);const s=ms/1000|0;return (s/60|0)+':'+String(s%60).padStart(2,'0')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const status=(t,e)=>{const s=$('#status');s.textContent=t;s.className='note'+(e?' err':'')};
const logm=t=>$('#log').textContent=t;
$('#redir').value=REDIR; $('#cid').value=LS.cid||'';
$('#gear').onclick=()=>$('#setup').classList.toggle('hide');

/* ---------- auth (PKCE, no server) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const cid=$('#cid').value.trim(); if(!cid) return status('Paste your Client ID first.',1);
  LS.cid=cid;
  const v=b64(crypto.getRandomValues(new Uint8Array(48))); LS.ver=v;
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIR,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
}
async function tokenReq(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:LS.cid,...body})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.error);
  LS.at=j.access_token; if(j.refresh_token) LS.rt=j.refresh_token; LS.exp=Date.now()+j.expires_in*1000;
}
async function token(){
  if(Date.now()>(+LS.exp||0)-60000) await tokenReq({grant_type:'refresh_token',refresh_token:LS.rt});
  return LS.at;
}
async function api(path,opt={}){
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}});
  if(!r.ok&&r.status!==204){let m='';try{m=(await r.json()).error.message}catch(e){} throw new Error(r.status+' '+m)}
  return r.status===204?null:r.json().catch(()=>null);
}
$('#login').onclick=login;

/* ---------- state ---------- */
const decks={A:{id:'A',track:null,cues:[null,null,null,null],pos:0,bpm:120,loop:null,taps:[]},
             B:{id:'B',track:null,cues:[null,null,null,null],pos:0,bpm:120,loop:null,taps:[]}};
let live=null, player=null, deviceId=null, snap=null /* {uri,pos,ts,paused,dur} */, master=.8, busy=false;
const curPos=()=>snap?(snap.paused?snap.pos:Math.min(snap.dur||1e9,snap.pos+(performance.now()-snap.ts))):0;

/* ---------- UI build ---------- */
function deckHTML(id){return `
<section class="card deck ${id}" id="deck${id}">
  <div class="tag"><span>DECK ${id}</span></div>
  <div class="trk"><img id="art${id}" alt=""><div><b id="ti${id}">Empty</b><span id="ar${id}">Search & load a track</span></div></div>
  <input type="range" id="sk${id}" min="0" max="1000" value="0">
  <div class="time"><span id="t${id}">0:00</span><span id="d${id}">0:00</span></div>
  <div class="row r2"><button class="play" id="pl${id}">▶ Play</button><button id="rs${id}">⟲ Start</button></div>
  <div class="lbl">Hot cues · tap set/jump · hold clear</div>
  <div class="row r4">${[0,1,2,3].map(i=>`<button class="pad" data-d="${id}" data-i="${i}">${i+1}</button>`).join('')}</div>
  <div class="lbl">Beat loop</div>
  <div class="row r5">${[[.25,'¼'],[.5,'½'],[1,'1'],[2,'2'],[4,'4']].map(([b,l])=>`<button class="loop" data-d="${id}" data-b="${b}">${l}</button>`).join('')}</div>
  <div class="row r2" style="grid-template-columns:1fr 1fr"><input type="number" id="bpm${id}" value="120" min="40" max="220" step="0.1" inputmode="decimal"><button id="tap${id}">TAP BPM</button></div>
</section>`}
$('#decks').innerHTML=deckHTML('A')+deckHTML('B');

/* ---------- playback core ---------- */
async function playOn(id,from){
  const d=decks[id]; if(!d.track||!deviceId) return;
  d.loop=null; live=id;
  if(snap&&snap.uri===d.track.uri){ await player.seek(from); await player.resume(); }
  else await api('/me/player/play?device_id='+deviceId,{method:'PUT',body:JSON.stringify({uris:[d.track.uri],position_ms:Math.floor(from)})});
  snap={uri:d.track.uri,pos:from,ts:performance.now(),paused:false,dur:d.track.duration_ms};
  render();
}
function park(){ if(live){decks[live].pos=curPos();decks[live].loop=null} }
async function fade(to,ms){
  const from=await player.getVolume(), n=Math.max(1,ms/40);
  for(let i=1;i<=n;i++){ await player.setVolume(from+(to-from)*i/n); await sleep(40); }
}
async function guard(fn){ if(busy) return; busy=true; try{await fn()}catch(e){logm('⚠ '+e.message)} busy=false; render(); }
const startPoint=id=>decks[id].cues[0]!=null?decks[id].cues[0]:decks[id].pos;

function mixTo(id){ return guard(async()=>{
  if(!decks[id].track) return logm('Load a track on deck '+id+' first.');
  if(live===id) return;
  const t=(+$('#ft').value)*1000;
  if(live&&snap&&!snap.paused){ park(); await fade(0,t/2); await playOn(id,startPoint(id)); await fade(master,t/2); }
  else { await player.setVolume(master); await playOn(id,startPoint(id)); }
});}
function cutTo(id){ return guard(async()=>{
  if(!decks[id].track) return logm('Load a track on deck '+id+' first.');
  if(live===id){ await player.seek(startPoint(id)); snap.pos=startPoint(id);snap.ts=performance.now(); return; }
  park(); await player.setVolume(master); await playOn(id,startPoint(id));
});}
$('#toA').onclick=()=>mixTo('A'); $('#toB').onclick=()=>mixTo('B');
$('#cutA').onclick=()=>cutTo('A'); $('#cutB').onclick=()=>cutTo('B');
$('#ft').oninput=e=>$('#ftv').textContent=e.target.value;
$('#vol').oninput=e=>{master=e.target.value/100; player&&player.setVolume(master)};

for(const id of ['A','B']){
  const d=decks[id];
  $('#pl'+id).onclick=()=>guard(async()=>{
    if(live===id){ await player.togglePlay(); if(snap){snap.pos=curPos();snap.ts=performance.now();snap.paused=!snap.paused} }
    else if(d.track){ park(); await player.setVolume(master); await playOn(id,d.pos); }
  });
  $('#rs'+id).onclick=()=>guard(async()=>{
    if(!d.track) return; d.loop=null;
    if(live===id){ await player.seek(0); snap.pos=0;snap.ts=performance.now(); } else d.pos=0;
  });
  $('#sk'+id).onchange=e=>guard(async()=>{
    if(!d.track) return; const p=e.target.value/1000*d.track.duration_ms;
    if(live===id){ await player.seek(p); snap.pos=p;snap.ts=performance.now(); } else d.pos=p;
  });
  $('#bpm'+id).onchange=e=>d.bpm=+e.target.value||120;
  $('#tap'+id).onclick=()=>{
    const n=performance.now(); d.taps=d.taps.filter(t=>n-t<2500); d.taps.push(n);
    if(d.taps.length>=3){const iv=[];for(let i=1;i<d.taps.length;i++)iv.push(d.taps[i]-d.taps[i-1]);
      d.bpm=Math.round(60000/(iv.reduce((a,b)=>a+b)/iv.length)*10)/10; $('#bpm'+id).value=d.bpm;}
  };
}
/* cue pads: tap = set / jump, hold = clear */
document.querySelectorAll('.pad').forEach(b=>{
  let timer=null,held=false;
  b.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;decks[b.dataset.d].cues[b.dataset.i]=null;navigator.vibrate&&navigator.vibrate(30);render()},600)});
  b.addEventListener('pointerup',()=>{clearTimeout(timer);if(held)return;cuePad(b.dataset.d,+b.dataset.i)});
  b.addEventListener('pointerleave',()=>clearTimeout(timer));
});
function cuePad(id,i){ const d=decks[id]; if(!d.track) return;
  const c=d.cues[i];
  if(c==null){ d.cues[i]=live===id?curPos():d.pos; return render(); }
  guard(async()=>{
    if(live===id){ d.loop=null; await player.seek(c); snap.pos=c;snap.ts=performance.now(); if(snap.paused){await player.resume();snap.paused=false} }
    else { park(); await player.setVolume(master); await playOn(id,c); }
  });
}
/* loops: poll position, seek back at the end (seek latency ≈ 50–200ms, so it jumps slightly early) */
document.querySelectorAll('.loop').forEach(b=>b.onclick=()=>{
  const d=decks[b.dataset.d]; if(live!==d.id||!snap||snap.paused) return logm('Loops work on the playing deck.');
  const len=+b.dataset.b*60000/d.bpm;
  if(d.loop&&d.loop.beats===+b.dataset.b) d.loop=null;
  else{const s=curPos(); d.loop={beats:+b.dataset.b,start:s,end:s+len,seeking:false};}
  render();
});
setInterval(()=>{
  const d=live&&decks[live]; if(!d||!d.loop||!snap||snap.paused||d.loop.seeking) return;
  if(curPos()>=d.loop.end-60){ d.loop.seeking=true; snap.pos=d.loop.start; snap.ts=performance.now();
    player.seek(d.loop.start).finally(()=>{ if(d.loop) d.loop.seeking=false }); }
},25);

/* ---------- render ---------- */
function render(){
  for(const id of ['A','B']){
    const d=decks[id],t=d.track,p=live===id?curPos():d.pos;
    $('#deck'+id).classList.toggle('live',live===id);
    $('#ti'+id).textContent=t?t.name:'Empty';
    $('#ar'+id).textContent=t?t.artists.map(a=>a.name).join(', '):'Search & load a track';
    $('#art'+id).src=t&&t.album.images.length?t.album.images[t.album.images.length-1].url:'';
    $('#t'+id).textContent=fmt(p); $('#d'+id).textContent=t?fmt(t.duration_ms):'0:00';
    const sk=$('#sk'+id); if(t&&document.activeElement!==sk) sk.value=p/t.duration_ms*1000;
    $('#pl'+id).textContent=live===id&&snap&&!snap.paused?'⏸ Pause':'▶ Play';
    document.querySelectorAll(`.pad[data-d=${id}]`).forEach((b,i)=>{const c=d.cues[i];b.classList.toggle('set',c!=null);b.textContent=c!=null?(i+1)+' · '+fmt(c):(i+1)});
    document.querySelectorAll(`.loop[data-d=${id}]`).forEach(b=>b.classList.toggle('on',!!d.loop&&d.loop.beats===+b.dataset.b));
  }
  $('#liveLbl').textContent=live?'LIVE: '+live:'—';
}
setInterval(render,150);

/* ---------- search ---------- */
let st;
$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>search(e.target.value.trim()),350)};
async function search(q){
  const box=$('#results'); if(!q){box.innerHTML='';return}
  try{
    const j=await api('/search?type=track&limit=8&q='+encodeURIComponent(q));
    window._res=j.tracks.items;
    box.innerHTML=window._res.map((t,i)=>`<div class="res"><img src="${t.album.images.length?t.album.images[t.album.images.length-1].url:''}" alt="">
      <div class="m"><b>${esc(t.name)}</b><span>${esc(t.artists.map(a=>a.name).join(', '))} · ${fmt(t.duration_ms)}</span></div>
      <button class="ba" data-i="${i}" data-d="A">A</button><button class="bb" data-i="${i}" data-d="B">B</button></div>`).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.d,window._res[b.dataset.i]));
  }catch(e){logm('⚠ '+e.message)}
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(id,t){ const d=decks[id];
  if(live===id){ logm('Deck '+id+' is live — mix to the other deck first.'); return; }
  Object.assign(d,{track:t,cues:[null,null,null,null],pos:0,loop:null}); d.cues[0]=0; render(); logm('Loaded on deck '+id+': '+t.name);
}

/* ---------- boot ---------- */
async function boot(){
  const code=new URLSearchParams(location.search).get('code');
  if(code){
    try{ await tokenReq({grant_type:'authorization_code',code,redirect_uri:REDIR,code_verifier:LS.ver}); }
    catch(e){ status('Login failed: '+e.message,1); }
    history.replaceState({},'',REDIR);
  }
  if(LS.rt){ $('#login').textContent='Re-login'; $('#start').classList.remove('hide'); status('Logged in. Tap Start set (needed so your phone allows audio).'); }
}
$('#start').onclick=()=>{
  status('Starting player…');
  window.onSpotifyWebPlaybackSDKReady=()=>{
    player=new Spotify.Player({name:'Pocket Deck',getOAuthToken:cb=>token().then(cb),volume:master});
    player.addListener('ready',({device_id})=>{deviceId=device_id;$('#setup').classList.add('hide');$('#app').classList.remove('hide');logm('Player ready. Search a track and load it on A and B.')});
    player.addListener('not_ready',()=>logm('Player went offline.'));
    player.addListener('player_state_changed',s=>{ if(!s)return;
      snap={uri:s.track_window.current_track.uri,pos:s.position,ts:performance.now(),paused:s.paused,dur:s.duration}; });
    for(const ev of ['initialization_error','authentication_error','account_error','playback_error'])
      player.addListener(ev,({message})=>{status(ev+': '+message,1);logm('⚠ '+message)});
    player.activateElement&&player.activateElement();
    player.connect();
  };
  const s=document.createElement('script'); s.src='https://sdk.scdn.co/spotify-player.js'; document.head.appendChild(s);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
};
boot();
</script>
</body>
</html>
